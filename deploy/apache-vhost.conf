<VirtualHost *:80>
    ServerAdmin admin@49.235.130.42
    DocumentRoot "/www/projects/webs/html"
    ServerName 80.49.235.130.42
    ServerAlias 49.235.130.42
    ErrorLog "/www/wwwlogs/49.235.130.42-error_log"
    CustomLog "/www/wwwlogs/49.235.130.42-access_log" combined

    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Order allow,deny
        Deny from all
    </Files>

    <IfModule alias_module>
        Alias /.well-known/ /www/wwwroot/java_node_ssl/
    </IfModule>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    RequestHeader set X-Forwarded-Proto "http"

    <Directory "/www/projects/webs/html">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.htm default.html default.htm
    </Directory>
</VirtualHost>
