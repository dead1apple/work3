server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: mall-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/jd_mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  type-aliases-package: com.ngsz.mall_server.pojo

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# Knife4j API
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**

# Custom Config
mall:
  order:
    payment-timeout-minutes: ${MALL_ORDER_PAYMENT_TIMEOUT_MINUTES:30}
    timeout-scan-delay-ms: ${MALL_ORDER_TIMEOUT_SCAN_DELAY_MS:60000}
    timeout-scan-batch-size: ${MALL_ORDER_TIMEOUT_SCAN_BATCH_SIZE:100}
  sms:
    mock: ${MALL_SMS_MOCK:true}
  pay:
    mock: ${MALL_PAY_MOCK:true}
  upload:
    directory: ${MALL_UPLOAD_DIR:uploads}
  coupon:
    expire-scan-delay-ms: ${MALL_COUPON_EXPIRE_SCAN_DELAY_MS:60000}
